[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scnet-mcp"
version = "0.1.0"
description = "Local SSH and Slurm MCP bridge for SCNet HPC clusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2"]

[project.scripts]
scnet-mcp = "scnet_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scnet_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/README.md", "/README.en.md", "/CHANGELOG.md", "/pyproject.toml", "/uv.lock", "/config.example.toml", "/codex-config.example.toml", "/install-codex.ps1", "/install-codex.sh"]
